<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC AI Studio V3</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{
background:#121212;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
}

.card{
background:#1e1e1e;
padding:20px;
border-radius:15px;
margin-top:20px;
}

button{
background:#00c853;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

#result{
margin-top:20px;
padding:15px;
background:#2d2d2d;
border-radius:10px;
line-height:1.8;
word-break:break-word;
max-height:500px;
overflow:auto;
}
</style>

</head>
<body>

<div class="container">

<h1>🎮 MC AI Studio V3</h1>

<p>
ตรวจสอบไฟล์ Minecraft (.mcpack / .mcaddon)
</p>

<div class="card">

<input type="file" id="fileInput">

<br><br>

<button onclick="checkFile()">
ตรวจสอบไฟล์
</button>

<div id="result">
ยังไม่มีไฟล์
</div>

</div>

</div>

<script>

async function checkFile(){

const file =
document.getElementById("fileInput").files[0];

const result =
document.getElementById("result");

if(!file){
result.innerHTML =
"❌ กรุณาเลือกไฟล์";
return;
}

const name =
file.name.toLowerCase();

if(
!name.endsWith(".mcpack") &&
!name.endsWith(".mcaddon")
){
result.innerHTML =
"❌ รองรับเฉพาะ .mcpack และ .mcaddon";
return;
}

try{

result.innerHTML =
"⏳ กำลังอ่านไฟล์...";

const zip =
await JSZip.loadAsync(file);

let fileList = "";
let count = 0;
let manifestFound = false;

for(const filename in zip.files){

count++;

fileList += filename + "<br>";

if(
filename.toLowerCase() ===
"manifest.json"
){
manifestFound = true;
}

}

result.innerHTML = `
✅ Minecraft Pack Loaded<br><br>

📄 ชื่อไฟล์:
${file.name}<br>

📦 ขนาด:
${(file.size/1024).toFixed(2)} KB<br>

📁 จำนวนไฟล์:
${count}<br>

📋 Manifest:
${manifestFound ? "✅ พบ" : "❌ ไม่พบ"}

<hr>

<b>📂 รายการไฟล์</b><br>

${fileList}
`;

}
catch(error){

result.innerHTML =
"❌ ไม่สามารถเปิดไฟล์ได้";

console.error(error);

}

}

</script>

</body>
</html>
