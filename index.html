<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MC AI Studio V9</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{
    margin-bottom:10px;
}

input[type=file]{
    width:100%;
    margin:10px 0;
}

button{
    background:#00c853;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#00e676;
}

#result{
    background:#222;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
}

.manifest-box{
    background:#252525;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
    line-height:1.6;
}

.manifest-box p{
    margin:6px 0;
}

.manifest-box h3{
    margin:0 0 10px 0;
}

.file-list{
    background:#252525;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
    white-space:pre-line;
    line-height:1.5;
}

hr{
    border:none;
    border-top:1px solid #555;
    margin:15px 0;
}

</style>
</head>

<body>

<div class="container">

<h1>🎮 MC AI Studio V9</h1>

<p>ตรวจสอบ Minecraft Pack (.mcpack / .mcaddon)</p>

<input type="file" id="fileInput">

<br><br>

<button onclick="checkFile()">🔍 ตรวจสอบไฟล์</button>

<div id="result"></div>

</div>

<script src="js/file-checker.js"></script>
<script src="js/manifest-reader.js"></script>
<script src="js/ai-analyzer.js"></script>
<script src="js/app.js"></script>

</body>
</html>
