<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC AI Studio V5</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{
    background:#121212;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.card{
    background:#1e1e1e;
    padding:20px;
    border-radius:15px;
}

button{
    background:#00c853;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

#result{
    margin-top:20px;
    background:#2d2d2d;
    padding:15px;
    border-radius:10px;
    line-height:1.8;
    white-space:pre-wrap;
}
</style>

</head>
<body>

<div class="container">

<h1>🎮 MC AI Studio V5</h1>

<p>ตรวจสอบไฟล์ Minecraft (.mcpack / .mcaddon)</p>

<div class="card">

<input type="file" id="fileInput">

<br><br>

<button onclick="checkFile()">
ตรวจสอบไฟล์
</button>

<div id="result">
ยังไม่มีไฟล์
</div>

</div>

</div>

<script>

async function checkFile(){

const file = document.getElementById("fileInput").files[0];
const result = document.getElementById("result");

if(!file){
    result.innerHTML = "❌ กรุณาเลือกไฟล์";
    return;
}

try{

const data = await file.arrayBuffer();
const zip = await JSZip.loadAsync(data);

const files = Object.keys(zip.files);

let manifestFound = false;

let packName = "Unknown";
let description = "Unknown";
let version = "Unknown";
let minEngine = "Unknown";

for(const filename of files){

    if(filename.toLowerCase().endsWith("manifest.json")){

        manifestFound = true;

        try{

            const text =
                await zip.files[filename].async("string");

            const manifest =
                JSON.parse(text);

            if(manifest.header){

                packName =
                    manifest.header.name || "Unknown";

                description =
                    manifest.header.description || "Unknown";

                version =
                    manifest.header.version
                    ? manifest.header.version.join(".")
                    : "Unknown";

                minEngine =
                    manifest.header.min_engine_version
                    ? manifest.header.min_engine_version.join(".")
                    : "Unknown";
            }

        }catch(err){
            console.error(err);
        }

        break;
    }
}

let packType = "Unknown";

if(files.some(f=>f.startsWith("textures/")))
    packType = "Resource Pack";

if(files.some(f=>f.startsWith("entities/")))
    packType = "Behavior Pack";

if(files.some(f=>f.startsWith("skins/")))
    packType = "Skin Pack";

const previewFiles =
files.slice(0,20).join("<br>");

result.innerHTML = `
✅ Minecraft Pack Loaded

📄 ชื่อไฟล์:
${file.name}

📦 ขนาด:
${(file.size/1024).toFixed(2)} KB

📁 จำนวนไฟล์:
${files.length}

🎮 ประเภท:
${packType}

📋 Manifest:
${manifestFound ? "✅ พบ" : "❌ ไม่พบ"}

<hr>

📋 ข้อมูล Manifest

🏷️ ชื่อ Pack:
${packName}

📝 คำอธิบาย:
${description}

🔢 เวอร์ชัน:
${version}

⚙️ Minecraft ขั้นต่ำ:
${minEngine}

<hr>

📂 รายการไฟล์

${previewFiles}
`;

}catch(error){

result.innerHTML = `
❌ ไม่สามารถเปิดไฟล์ได้

รองรับเฉพาะ .mcpack และ .mcaddon
`;

console.error(error);

}

}

</script>

</body>
</html>
