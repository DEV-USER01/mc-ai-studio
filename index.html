<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MC AI Studio V9</title>

<style>

body{
    background:#121212;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.card{
    background:#1e1e1e;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
}

button{
    background:#00c853;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    opacity:.9;
}

#result{
    margin-top:20px;
    padding:15px;
    background:#2d2d2d;
    border-radius:10px;
    line-height:1.8;
    white-space:pre-wrap;
}

hr{
    border:1px solid #555;
}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

</head>
<body>

<div class="container">

<h1>🎮 MC AI Studio V9</h1>

<p>
ตรวจสอบ Minecraft Pack (.mcpack / .mcaddon)
</p>

<div class="card">

<input type="file" id="fileInput">

<br><br>

<button onclick="checkFile()">
ตรวจสอบไฟล์
</button>

<div id="result">
ยังไม่ได้เลือกไฟล์
</div>

</div>

</div>

<script src="js/file-checker.js"></script>
<script src="js/manifest-reader.js"></script>
<script src="js/pack-type-detector.js"></script>
<script src="js/pack-validator.js"></script>
<script src="js/report-generator.js"></script>
<script src="js/ai-analyzer.js"></script>
<script src="js/app.js"></script>

</body>
</html>
