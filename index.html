<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MC AI Studio</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{
background:#121212;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
}

.card{
background:#1e1e1e;
padding:20px;
border-radius:15px;
margin-top:20px;
}

button{
background:#00c853;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
}

#result{
margin-top:20px;
background:#2d2d2d;
padding:15px;
border-radius:10px;
line-height:1.7;
white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="container">

<h1>🎮 MC AI Studio V6</h1>

<p>ตรวจสอบ Minecraft Pack (.mcpack / .mcaddon)</p>

<div class="card">

<input type="file" id="fileInput">

<br><br>

<button onclick="startAnalyze()">
ตรวจสอบไฟล์
</button>

<div id="result">
ยังไม่ได้เลือกไฟล์
</div>

</div>

</div>

<script src="js/file-checker.js"></script>
<script src="js/manifest-reader.js"></script>
<script src="js/ai-analyzer.js"></script>
<script src="js/app.js"></script>

</body>
</html>
