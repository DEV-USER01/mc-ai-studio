<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MC AI Studio V15</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f0f0f;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    margin-bottom:10px;
}

.subtitle{
    color:#bdbdbd;
    margin-bottom:20px;
}

.upload-box{
    background:#1f1f1f;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
}

input[type=file]{
    width:100%;
    margin-bottom:15px;
}

button{
    background:#00c853;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    background:#00e676;
}

#result{
    margin-top:15px;
}

.manifest-box{
    background:#222;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
}

.manifest-box h3{
    margin-bottom:10px;
}

.manifest-box p{
    margin:6px 0;
    line-height:1.5;
}

.file-list{
    background:#222;
    padding:15px;
    border-radius:12px;
    overflow:auto;
    max-height:500px;
    line-height:1.5;
}

.file-list h3{
    margin-bottom:10px;
}

hr{
    border:none;
    border-top:1px solid #444;
    margin:15px 0;
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#888;
    font-size:13px;
}

</style>

</head>

<body>

<div class="container">

    <h1>🎮 MC AI Studio V15</h1>

    <div class="subtitle">
        ตรวจสอบ Minecraft Pack (.mcpack / .mcaddon)
    </div>

    <div class="upload-box">

        <input
            type="file"
            id="fileInput"
            accept=".mcpack,.mcaddon,.zip"
        >

        <button onclick="checkFile()">
            🔍 ตรวจสอบไฟล์
        </button>

    </div>

    <div id="result"></div>

    <div class="footer">
        MC AI Studio V15 • Minecraft Pack Analyzer
    </div>

</div>

<script src="js/file-checker.js"></script>
<script src="js/manifest-reader.js"></script>
<script src="js/ai-analyzer.js"></script>
<script src="js/app.js"></script>

</body>
</html>
